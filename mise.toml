# Common nsh development and packaging commands.
#
#   mise run check
#   mise run test
#   mise run run -- --window-size 1440x960
#   mise run gpui -- --window-size 1440x960
#   mise run package -- --icon assets/icon.png
#
# Extra arguments are appended to `nsh run`, `nsh dev`, `nsh check`,
# `nsh test` and `nsh build`. The packaging tasks forward them too.

# Local development toolchain. Keep `rust` in sync with rust-toolchain.toml
# and `nsh` in sync with the version installed by CI (.github/workflows/*.yml).
[tools]
rust = "1.99.1"
"github:longbridge/nsh" = "0.6.1"

[tasks.run]
description = "Run the app in the native development host"
run = "nsh run"

[tasks.dev]
description = "Run the app with hot reload"
run = "nsh dev"

# GPUI is a development/embedding backend in NSH 0.6.1; `nsh package` writes
# the GTK 4 Linux runner and (on a Mac) the AppKit macOS bundle, and neither
# takes the GPUI backend. NSH installs the GPUI component on first use;
# pre-add it with `nsh component add gpui` when offline.
# This task previews the app as GPUI and GPUI Kit apps that embed it would draw it.
[tasks.gpui]
description = "Preview the app in the GPUI development host (not packaged)"
run = "nsh run --target gpui"

[tasks.check]
description = "Type-check the Rust crate and the TSX UI"
run = "nsh check"

[tasks.test]
description = "Run cargo tests and the headless App.test.tsx suite"
run = "nsh test"

[tasks.build]
description = "Build the release bundle without packaging"
run = "nsh build --release"

[tasks.hooks]
description = "Point git at the hooks in .githooks (once per clone)"
run = "bash scripts/install_hooks.sh"

[tasks.package]
description = "Package a release (TARGET defaults to linux, OUT to .nsh/out)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
nsh package --target "${TARGET:-linux}" --out "${OUT:-.nsh/out}" "$@"
'''

[tasks.release]
description = "Check, test, then package the release (TARGET defaults to linux)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
nsh check
nsh test
nsh package --target "${TARGET:-linux}" --out "${OUT:-.nsh/out}" "$@"
'''
