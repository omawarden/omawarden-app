[package]
name = "nsh-app-omawarden-app"
version = "0.6.0"
edition = "2024"
publish = false

[workspace]
exclude = ["engine"]

[dependencies]
nsh-core = "0.6.1"
# Not named anywhere in this crate's source: the Linux runner links `nsh-base`
# unconditionally and the base components/theme come from it. Keep the pin so
# the app is built against the same base the host resolves.
nsh-base = "0.6.1"
# Pinned by revision, not branch: the release builds the bundled daemon from
# this commit, and the app compares every external daemon against it. Update
# the comment and the revision together. scripts/check_engine_pin.sh enforces it.
#
# engine 0.12.2 (`omawarden-0.12.2`) — the first line that has the pluggable
# Keyring Provider, so `MacOsKeychainProvider` talks to Security.framework and
# `SecretToolKeyringProvider` keeps the Linux path. An older engine knows only
# `secret-tool`, which macOS does not have, so a macOS session would not
# persist. The revision is the engine's `develop` line, which is what the
# sibling checkout builds locally.
#
# `#437` took `open_file` and `notify` out of `get_attachment` and deleted the
# `notify-send`/`xdg-open` pair behind them: the engine writes the file and the
# host opens it. `#435` made the SSH approval card identify its requester off
# Linux. Neither changes anything else this app calls.
omawarden = { git = "https://github.com/icyleaf/omarchy-bitwarden.git", rev = "457195fc52f89f9b60abf23d3c0218562926a21c" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
url = "2.5"
which = "8.0"
chrono = "0.4"
regex = "1.10"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"

# Keep the debug host small: `nsh run` builds the dev profile, and full debug
# info alone put ~60 MB of the host binary's pages into RSS.
[profile.dev]
opt-level = "s"
debug = 0
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
