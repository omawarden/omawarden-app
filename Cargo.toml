[package]
name = "nsh-app-omawarden-app"
version = "0.4.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
omawarden = { git = "https://github.com/icyleaf/omarchy-bitwarden.git", branch = "develop" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
url = "2.5"
which = "8.0"
chrono = "0.4"
regex = "1.10"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"

# Keep the debug host small: `nsh run` builds the dev profile, and full debug
# info alone put ~60 MB of the host binary's pages into RSS.
[profile.dev]
opt-level = "s"
debug = 0
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
