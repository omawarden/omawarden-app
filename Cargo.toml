[package]
name = "nsh-app-omawarden-app"
version = "0.3.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.3.0"
nsh-base = "0.3.0"
omawarden = { path = "../omarchy-bitwarden/omawarden" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
which = "8.0"
chrono = "0.4"
regex = "1.10"

# Keep the debug host small: `nsh run` builds the dev profile, and full debug
# info alone put ~60 MB of the host binary's pages into RSS.
[profile.dev]
opt-level = "s"
debug = 0
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
