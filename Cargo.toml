[package]
name = "nsh-app-omawarden-app"
version = "0.6.0"
edition = "2024"
publish = false

[workspace]
exclude = ["engine"]

[dependencies]
nsh-core = "0.6.1"
# Not named anywhere in this crate's source: the Linux runner links `nsh-base`
# unconditionally and the base components/theme come from it. Keep the pin so
# the app is built against the same base the host resolves.
nsh-base = "0.6.1"
# Pinned by revision, not branch: the release builds the bundled daemon from
# this commit, and the app compares every external daemon against it. Update
# the comment and the revision together. scripts/check_engine_pin.sh enforces it.
#
# engine 0.12.2 — the first line that has the pluggable
# Keyring Provider, so `MacOsKeychainProvider` talks to Security.framework and
# `SecretToolKeyringProvider` keeps the Linux path. An older engine knows only
# `secret-tool`, which macOS does not have, so a macOS session would not
# persist. The revision is the engine's `develop` line, which is what the
# sibling checkout builds locally.
#
# `2cdd69f` is that line sixteen commits past `omawarden-0.12.2`, and it is the
# first revision that can be asked what it can do: `ping` gained a
# `capabilities` array in `ac88555`, whose parent is the previous pin. Five
# revisions report version `0.12.2` with different capabilities — the release
# tag has none, `ac88555` has four, `develop` has five — so a daemon's version
# string says nothing about what it supports, and reading `capabilities` is the
# only way to tell them apart (app #73). This revision also carries the
# engine's first organization write path; the app ignores it, and `org_write`
# is read but not required.
#
# `#461`/`#459`/`#460`/`#458` are that organization work. None of it changes
# what the app calls, but `VaultItem` gained `edit`, `view_password`,
# `can_delete` and `can_restore`, which the app's own test fixture constructs.
# `#450` added the capabilities array and `vault get`.
#
# `#437` took `open_file` and `notify` out of `get_attachment` and deleted the
# `notify-send`/`xdg-open` pair behind them: the engine writes the file and the
# host opens it. `#435` made the SSH approval card identify its requester off
# Linux. `#432` added a blocking macOS job to the engine's own CI. None changes
# anything else this app calls.
omawarden = { git = "https://github.com/icyleaf/omarchy-bitwarden.git", rev = "2cdd69fd21e1e22cfc1058d38132b7cfdc45eb82" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
url = "2.5"
which = "8.0"
chrono = "0.4"
regex = "1.10"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"

# Keep the debug host small: `nsh run` builds the dev profile, and full debug
# info alone put ~60 MB of the host binary's pages into RSS.
[profile.dev]
opt-level = "s"
debug = 0
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
