[profile.dev]
opt-level = "s"
debug = 0
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = "s"
debug = 0

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"
codegen-units = 1

# Local development builds against the sibling checkout. CI removes this table
# before building so the git dependency in Cargo.toml is used instead.
[patch."https://github.com/icyleaf/omarchy-bitwarden.git"]
omawarden = { path = "../omarchy-bitwarden/omawarden" }
